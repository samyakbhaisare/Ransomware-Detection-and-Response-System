limit_req_zone $binary_remote_addr zone=public_reads:10m rate=10r/s;

server {
    listen 80;
    server_name 192.46.208.222;
    if ($request_method !~ ^(GET|HEAD)$) { return 403; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / { return 308 https://192.46.208.222$request_uri; }
}

server {
    listen 443 ssl;
    server_name 192.46.208.222;
    ssl_certificate /etc/letsencrypt/live/rdrs-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rdrs-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "clipboard-write=(self)" always;

    # Original history contains private paths and process command lines.
    # Data reads and all mutations require authenticated SSH tunnel access to
    # the backend loopback port. Only UI, health and allowlisted aggregates are public.
    if ($request_method !~ ^(GET|HEAD)$) { return 403; }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location ~ ^/(health|public-summary|status|dashboard-data|events|processes|alerts|incidents|reports|reports/[0-9]+/(json|csv))?$ {
        limit_req zone=public_reads burst=30 nodelay;
        proxy_pass http://rdrs:8000;
        proxy_set_header Host $host;
        proxy_set_header X-RDRS-Public 1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "clipboard-write=(self)" always;
    }
    location / { return 403; }
}
